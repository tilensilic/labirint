<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vesoljski Labirint</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="uiWrap">
        <div id="container">
            <i id="astronavt" class="fa-solid fa-user-astronaut"></i>
            <i id="raketa" class="fa-solid fa-rocket"></i>
            <canvas id="canvas"></canvas>
        </div>

        <div id="controls">
            <div class="topRow">
                <div class="controlBox selectBox">
                    <select id="difficulty">
                        <option value="180000">Težavnost 1 (3:00)</option>
                        <option value="120000">Težavnost 2 (2:00)</option>
                        <option value="60000">Težavnost 3 (1:00)</option>
                    </select>
                </div>
                <div class="controlBox timerBox" id="timer">03:00</div>
            </div>

            <div class="bottomRow">
                <button id="instructionsBtn">Navodila</button>
                <button id="playBtn">Igraj</button>
                <button id="showSolution">Rešitev</button>
            </div>
        </div>
    </div>

    <div id="instructionsModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Navodila</h2>
            <p>Astronavta pripelji do rakete z uporabo tipk <b>WASD</b> ali <b>puščic</b>.</p>
            <button class="modal-close-btn" onclick="document.getElementById('instructionsModal').style.display='none'">Zapri</button>
        </div>
    </div>

    <script src="js/javascript.js"></script>
</body>
</html>
