<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Labirint v Vesolju</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="uiWrap">
    <div id="container">
      <i id="astronavt" class="fa-solid fa-user-astronaut"></i>
      <i id="raketa" class="fa-solid fa-rocket"></i>
      <canvas id="canvas"></canvas>
    </div>

    <div id="controls">
      <div class="topRow">
        <div class="controlBox selectBox">
          <select id="difficulty">
            <option value="1">Težavnost 1 (3:00)</option>
            <option value="2">Težavnost 2 (2:00)</option>
            <option value="3">Težavnost 3 (1:00)</option>
          </select>
        </div>
        <div class="controlBox timerBox" id="timer">03:00</div>
      </div>

      <div class="bottomRow">
        <button id="instructionsBtn">Navodila</button>
        <button id="playBtn">Igraj</button>
        <button id="showSolution">Rešitev</button>
      </div>
    </div>
  </div>

  <div id="instructionsModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2><i class="fa-solid fa-rocket-launch"></i> Navodila</h2>
      <div class="instructions-body">
        <p>Premikaj se z <b>WASD</b> ali <b>puščicami</b>. Dosezi raketo preden zmanjka kisika!</p>
      </div>
      <button class="modal-close-btn" id="closeModalBtn">Razumem, gremo!</button>
    </div>
  </div>

  <script src="js/javascript.js"></script>
</body>
</html>
