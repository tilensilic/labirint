<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Labirint</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="uiWrap">
    <div id="container">
      <i id="astronavt" class="fa-solid fa-user-astronaut" aria-label="Astronavt"></i>
      <i id="raketa" class="fa-solid fa-rocket" aria-label="Raketa"></i>
      <canvas id="canvas"></canvas>
    </div>

    <div id="controls">
      <div class="topRow">
        <div class="controlBox selectBox">
          <select id="difficulty">
            <option value="1">Težavnost 1 (3:00)</option>
            <option value="2">Težavnost 2 (2:00)</option>
            <option value="3">Težavnost 3 (1:00)</option>
          </select>
        </div>

        <div class="controlBox timerBox" id="timer">03:00</div>
      </div>

      <div class="bottomRow">
        <button id="playBtn">Igraj</button>
        <button id="showSolution">Prikaži rešitev</button>
      </div>
    </div>
  </div>

  <script src="js/javascript.js"></script>
</body>
</html>
