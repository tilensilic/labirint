<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Labirint v Vesolju</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="uiWrap">
    <div id="container">
      <i id="astronavt" class="fa-solid fa-user-astronaut" aria-label="Astronavt"></i>
      <i id="raketa" class="fa-solid fa-rocket" aria-label="Raketa"></i>
      <canvas id="canvas"></canvas>
    </div>

    <div id="controls">
      <div class="topRow">
        <div class="controlBox selectBox">
          <select id="difficulty">
            <option value="1">Težavnost 1 (3:00)</option>
            <option value="2">Težavnost 2 (2:00)</option>
            <option value="3">Težavnost 3 (1:00)</option>
          </select>
        </div>
        <div class="controlBox timerBox" id="timer">03:00</div>
      </div>

      <div class="bottomRow">
        <button id="instructionsBtn">Navodila</button>
        <button id="playBtn">Igraj</button>
        <button id="showSolution">Rešitev</button>
      </div>
    </div>
  </div>

  <div id="instructionsModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Navodila za igro</h2>
      <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px;">
      <ul>
        <li><i class="fa-solid fa-bullseye"></i> <strong>Cilj:</strong> Pripelji astronavta do rakete.</li>
        <li><i class="fa-solid fa-keyboard"></i> <strong>Kontrole:</strong> Uporabi tipke <b>W, A, S, D</b> ali <b>puščice</b>.</li>
        <li><i class="fa-solid fa-clock"></i> <strong>Čas:</strong> Reši labirint, preden se izteče čas.</li>
        <li><i class="fa-solid fa-lightbulb"></i> <strong>Pomoč:</strong> Gumb "Rešitev" ti pokaže pot, a konča igro.</li>
      </ul>
    </div>
  </div>

  <script src="js/javascript.js"></script>
</body>
</html>
